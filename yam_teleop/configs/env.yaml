# Gym environment configuration

# Where to read synchronized metadata (from broker — small JSON, no images)
broker_port: 5005

# Camera image stream (from camera_node directly, bypasses broker).
# Each frame carries the same `timestamp_ns` as the broker's metadata,
# so env._get_obs() pairs them by exact timestamp equality.
camera_port: 5001

# Direct gello state stream (from gello_node, bypasses broker).
# Used by collect_data's teleop loop to drive YAM at gello's native ~200Hz
# instead of being gated on the broker's camera rate (~60Hz).
gello_state_port: 5004

# Where to send commands (to robot_node)
robot_cmd_port: 5003

# Home position for reset [left_arm(6) + left_grip(1) + right_arm(6) + right_grip(1)]
# Gripper: 0.0 = closed, 0.85 = max open (hardware limit)
home_position: [0.000000, 1.134464, 1.396263, -1.570796, 0.000000, 0.000000, 0.000000,
                0.000000, 1.134464, 1.396263, -1.570796, 0.000000, 0.000000, 0.000000]

# Rest/sit pose the arms park in on shutdown (env.return_to_rest): all joints 0
# so the arms fold down at the base instead of holding
# the raised home_position. Mirrors robot.yaml's safe-shutdown home; grippers
# open (0.85). Same 14-dim layout as home_position.
rest_position: [0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.850000,
                0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.850000]

# Gripper open limit in command space (hardware can't reach 1.0)
gripper_max_open: 0.85

# How close joints must be to home before reset() returns (radians)
reset_tolerance: 0.05

# Max joint movement per step during reset (radians). Smaller = slower/safer.
reset_max_delta: 0.01

# Control frequency (should match broker rate)
control_freq_hz: 60
