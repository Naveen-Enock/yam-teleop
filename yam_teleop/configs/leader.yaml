# YAM leader-arm configuration (teaching handles)
# Two YAM arms with yam_teaching_handle grippers, backdriven in gravity-comp.
# Per-arm `gravity_comp_factor:` overrides the node-level value below. These
# cheap leader arms vary unit-to-unit, so they're tuned independently.
left:
  can_channel: can_leader_l
  gravity_comp_factor: 1.0   # neutral at 1.0
right:
  can_channel: can_leader_r
  gravity_comp_factor: 1.1   # joint 4 sags at 1.0; needs a bit more

# Gravity-compensation scale for the LEADER arms. i2rt's get_yam_robot hardcodes
# 1.3 (tuned for position-controlled followers, where 30% over-comp is masked by
# the PD and fights friction). A leader backdrives with kp=0, so 1.3 makes it
# float UPWARD ("shoots up"). 1.0 = neutral. Lower toward ~0.9 if it still drifts
# up; raise if it sags. This node-level value is the fallback/default; the
# per-arm overrides above take precedence.
gravity_comp_factor: 1.0

publish_rate_hz: 200
zmq_port: 5004          # state PUB (gello-compatible shape)
zmq_cmd_port: 5006      # commands PULL (position targets + torque control)
robot_state_port: 5002  # follower state stream (robot_node PUB) for bilateral

# Bilateral force feedback gain: scales the arm's nominal joint kp
# ([80,80,80,40,10,10]) with kd=0. i2rt recommends 0.1-0.2; 0 = pure passive
# backdrive (old gello feel). Start conservative for first hardware bring-up.
bilateral_kp: 0.1

# Teaching-handle trigger -> gripper command. i2rt normalizes the trigger to
# ~0..1; invert so squeezed=0 (close), relaxed=1 (open), matching the gello
# convention collect_data expects. Verify the sign on hardware.
gripper_invert: true

# Match/reset slew (RESET drive + clutch RESUME_MATCH): how fast the leader
# drives itself toward the target pose, and the tolerance to declare a match.
match_max_delta: 0.01   # rad per control tick (~2 rad/s at 200Hz)
match_tol: 0.05         # rad
