[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yam_teleop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "pyzmq",
    "opencv-python",
    "numpy",
    "pyyaml",
    "h5py",                # HDF5 episode read/write (collect_yam, replay_episode)
    "tqdm",                # progress bars (camera/robot/leader nodes, broker)
    "loop-rate-limiters",  # fixed-rate control loops (robot_node, leader nodes)
    "pyaudio",             # per-episode audio capture (record_audio) — needs system portaudio
    "matplotlib",          # collect plotting + live gripper plot
    "pyqt5",               # interactive backend for robot_node --plot-gripper live window
    "evdev ; sys_platform == 'linux'",  # foot pedals (foot_pedal.py); came via the old i2rt fork
]

[project.optional-dependencies]
# Audio transcription (transcribe_audio.py). Heavy / GPU-oriented:
# faster-whisper pulls ctranslate2 / av / tokenizers. Opt-in only.
transcribe = [
    "faster-whisper",
]
# GELLO (Dynamixel) leader arms — gello_node. Not needed on YAM-leader rigs.
gello = [
    "dynamixel-sdk",       # vendored driver in yam_teleop/hardware/gello/
]

[tool.setuptools.packages.find]
include = ["yam_teleop*"]
