# uv workspace root for yam-teleop development.
#
# i2rt (the YAM SDK) comes straight from upstream, pinned to a release tag —
# no fork, no submodule. To upgrade, bump the tag below and re-run `uv sync`.
#   uv sync                    -> i2rt + yam_teleop (editable)
#   uv sync --extra transcribe -> + faster-whisper transcription
[project]
name = "yam-teleop-dev"
version = "0"
requires-python = ">=3.10"
dependencies = [
    "i2rt",
    "yam_teleop",
]

[project.optional-dependencies]
transcribe = ["yam_teleop[transcribe]"]

[tool.uv]
package = false
# Mirrors upstream i2rt's own [tool.uv] setting (not inherited by dependents):
# ruckig 0.15.3 ships only an sdist, and its build breaks under
# scikit-build-core >= 0.10.
build-constraint-dependencies = ["scikit-build-core<0.10"]

[tool.uv.workspace]
members = ["yam_teleop"]

[tool.uv.sources]
i2rt = { git = "https://github.com/i2rt-robotics/i2rt", tag = "v1.3.6" }
yam_teleop = { workspace = true }
